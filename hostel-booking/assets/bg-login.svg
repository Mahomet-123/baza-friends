<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- Восточные обои: звезда-гирих, арка с койкой, фанус, дом с арочными окнами -->
  <g fill="none" stroke="#cdbfa4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".55">

    <!-- 8-конечная звезда (два квадрата) — левый верх -->
    <g transform="translate(65,65)">
      <rect x="-22" y="-22" width="44" height="44"/>
      <rect x="-22" y="-22" width="44" height="44" transform="rotate(45)"/>
      <circle r="7"/>
      <circle r="2" fill="#cdbfa4" stroke="none"/>
    </g>

    <!-- фанус (восточный фонарь) — левый низ -->
    <g transform="translate(65,195)">
      <circle cx="0" cy="-32" r="3"/>
      <path d="M-12,-17 Q0,-29 12,-17"/>
      <path d="M-12,-17 L-15,10 Q0,18 15,10 L12,-17 Z"/>
      <path d="M-5,-16 L-6.5,12"/>
      <path d="M5,-16 L6.5,12"/>
      <path d="M0,18 L0,24"/>
      <circle cx="0" cy="27" r="2.5"/>
    </g>

    <!-- дом-хостел с арочными окнами — правый низ -->
    <g transform="translate(195,196)">
      <path d="M-28,-22 L-28,26 L28,26 L28,-22"/>
      <path d="M-28,-22 L-28,-27 L-20,-27 L-20,-22 L-12,-22 L-12,-27 L-4,-27 L-4,-22 L4,-22 L4,-27 L12,-27 L12,-22 L20,-22 L20,-27 L28,-27 L28,-22"/>
      <path d="M-19,4 L-19,-6 A5.5,5.5 0 0 1 -8,-6 L-8,4 Z"/>
      <path d="M8,4 L8,-6 A5.5,5.5 0 0 1 19,-6 L19,4 Z"/>
      <path d="M-7,26 L-7,14 A7,7 0 0 1 7,14 L7,26"/>
      <path d="M-34,26 L34,26"/>
    </g>

    <!-- ромбик и точки-акценты -->
    <path d="M130,122 L138,130 L130,138 L122,130 Z"/>
    <circle cx="20" cy="20" r="1.8" fill="#cdbfa4" stroke="none"/>
    <circle cx="240" cy="20" r="1.8" fill="#cdbfa4" stroke="none"/>
    <circle cx="20" cy="240" r="1.8" fill="#cdbfa4" stroke="none"/>
    <circle cx="240" cy="240" r="1.8" fill="#cdbfa4" stroke="none"/>
  </g>

  <!-- стрельчатая арка с койкой (зелёный акцент) — правый верх -->
  <g fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".3" transform="translate(195,65)">
    <path d="M-26,30 L-26,-8 C-26,-24 -16,-30 0,-34 C16,-30 26,-24 26,-8 L26,30"/>
    <path d="M-32,30 L32,30"/>
    <!-- койка под аркой -->
    <path d="M-16,22 L-16,4"/>
    <path d="M-16,10 L16,10 L16,22"/>
    <path d="M-16,16 L16,16"/>
    <rect x="-13" y="5" width="9" height="5" rx="2.5"/>
  </g>
</svg>
